<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>冒险者档案 · 个人主页</title>
<meta name="description" content="游戏化个人主页：滚动时间轴驱动的数值 / 技能面板">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M5 27 27 5M5 5h22v22' stroke='%23f2c14e' stroke-width='3' fill='none'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/main.css" />
<link rel="stylesheet" href="assets/css/panel.css" />
<link rel="stylesheet" href="assets/css/wallgame.css" />
<link rel="stylesheet" href="assets/css/hic.css" />
</head>
<body>

<div class="bg-brick" aria-hidden="true"></div>
<div class="bg-veil" aria-hidden="true"></div>
<!-- 全屏光照层已移除：光照改为【每页一个独立光源】（见 .page-light）。
     原固定层 z-index:2 位于 .deck（z-index:3，且两页不透明）之下，
     被完全遮挡、对画面零贡献。 -->

<div class="expbar" aria-hidden="true"><i id="expFill"></i><span id="expText">EXP 0%</span></div>

<!-- 分页容器：第一页钉住，第二页自下而上盖住它完成翻页 -->
<div class="deck" id="deck">

  <!-- 第一页：个人简介 + GitHub 仓库陈列 -->
  <section class="page page--intro" id="pageIntro">
    <div class="page-light" id="lightIntro" aria-hidden="true"></div>
    <header class="hero" id="hero"></header>

    <section class="projects">
      <h2 class="proj-title">炼金工坊 ・ 项目陈列</h2>
      <p class="proj-sub">把图形化的东西变成文本，再把文本交给 AI 接手。</p>
      <div class="proj-grid" id="projGrid"></div>
    </section>

    <div class="page-hint" id="pageHint" aria-hidden="true">继续下滑 ・ 进入履历</div>
  </section>

  <!-- 翻页门限：滚过这段距离之前第二页不会出现 -->
  <div class="page-gate" id="pageGate" aria-hidden="true"></div>

  <!-- 第二页：履历时间轴 + 数值面板 -->
  <section class="page page--resume" id="pageResume">
    <div class="page-light" id="lightResume" aria-hidden="true"></div>

    <!-- 楼板：下一层的"地板"。翻页时随第二页自下而上升起，
         视觉上就是踩过楼板、下到下一层地牢。 -->
    <div class="floor-slab" aria-hidden="true"></div>

    <main class="layout">
      <div class="col-main">
        <div class="timeline">
          <div class="tl-axis"><i id="tlProgress"></i></div>
          <div class="tl-list" id="chapters"></div>
        </div>
      </div>

      <aside class="col-side">
        <div class="panel-wrap">
          <div class="dnf-frame panel" id="panel" aria-live="polite">
            <div class="frame-in"></div>
          </div>
        </div>
      </aside>
    </main>
  </section>

</div>

<footer class="site-foot" id="foot"></footer>

<div class="tip" id="tip" role="tooltip" aria-hidden="true"></div>

<script src="assets/js/data.js" defer></script>
<script src="assets/js/templates.js" defer></script>
<script src="assets/js/projects.js" defer></script>
<script src="assets/js/app.js" defer></script>
<script src="assets/js/pages.js" defer></script>
<script src="assets/js/lighting.js" defer></script>
<script src="assets/js/wallgame.js" defer></script>
<script src="assets/js/hic-hero.js" defer></script>
</body>
</html>
